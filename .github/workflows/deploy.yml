name: Deploy Prophet

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd /Users/pony/Documents/code/evolutionary-prophecy
          git fetch origin main
          git reset --hard origin/main

      - name: Install dependencies
        run: |
          cd /Users/pony/Documents/code/evolutionary-prophecy
          npm ci

      - name: Generate Prisma client
        run: |
          cd /Users/pony/Documents/code/evolutionary-prophecy
          npx prisma generate

      - name: Apply database schema
        run: |
          cd /Users/pony/Documents/code/evolutionary-prophecy
          DATABASE_URL="file:/Users/pony/Documents/code/evolutionary-prophecy/prisma/dev.db" npx prisma db push --accept-data-loss

      - name: Build standalone
        run: |
          cd /Users/pony/Documents/code/evolutionary-prophecy
          DATABASE_URL="file:/Users/pony/Documents/code/evolutionary-prophecy/prisma/dev.db" npm run build:standalone

      - name: Restart Prophet service
        run: |
          launchctl unload /Users/pony/Library/LaunchAgents/com.pony.prophet.plist || true
          launchctl load /Users/pony/Library/LaunchAgents/com.pony.prophet.plist

      - name: Health check
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3460 > /dev/null; then
              echo "Prophet is up on port 3460"
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed"
          exit 1
