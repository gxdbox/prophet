name: Deploy Prophet

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /Users/pony/Documents/code/evolutionary-prophecy
    env:
      http_proxy: http://127.0.0.1:7897
      https_proxy: http://127.0.0.1:7897
      no_proxy: localhost,127.0.0.1,::1
    steps:
      - name: Pull latest code
        env:
          HTTP_PROXY: http://127.0.0.1:7897
          HTTPS_PROXY: http://127.0.0.1:7897
        run: |
          git reset --hard
          git pull origin main

      - name: Install dependencies
        env:
          HTTP_PROXY: http://127.0.0.1:7897
          HTTPS_PROXY: http://127.0.0.1:7897
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database schema
        run: DATABASE_URL="file:/Users/pony/Documents/code/evolutionary-prophecy/prisma/dev.db" npx prisma db push --accept-data-loss

      - name: Build standalone
        run: DATABASE_URL="file:/Users/pony/Documents/code/evolutionary-prophecy/prisma/dev.db" npm run build:standalone

      - name: Restart Prophet service
        run: |
          launchctl unload /Users/pony/Library/LaunchAgents/com.pony.prophet.plist || true
          launchctl load /Users/pony/Library/LaunchAgents/com.pony.prophet.plist

      - name: Health check
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3460 > /dev/null; then
              echo "Prophet is up on port 3460"
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed"
          exit 1
